<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>V-리그 남자배구 대시보드</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- 지도(Leaflet) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="" referrerpolicy="no-referrer">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="" referrerpolicy="no-referrer"></script>

  <!-- 캐시 무력화: GitHub Pages 캐시 때문에 예전 JS/CSS가 섞이는 것을 막는다 -->
  <script>window.__V = Date.now();</script>
  <script>document.write('<link rel="stylesheet" href="assets/style.css?v=' + window.__V + '">');</script>
  <noscript><link rel="stylesheet" href="assets/style.css"></noscript>
</head>
<body>

  <div id="loader">
    <div class="icon-bounce">🏐</div>
    <div class="spinner"></div>
    <div class="loader-title">V-리그 남자배구 대시보드</div>
    <div class="loader-desc">데이터를 불러오는 중...</div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">🏐</span>
      <div>
        <h1>V-리그 남자배구</h1>
        <p class="brand-sub">대시보드 · 2026-27 시즌 · 남자부 7개 구단</p>
      </div>
    </div>
    <div class="top-right">
      <button class="myteam-chip" id="myteam-chip">⭐ 마이팀 설정</button>
      <div class="updated" id="updated-at">갱신: —</div>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="myteam">⭐ 마이팀</button>
    <button class="tab active" data-tab="schedule">🔥 경기 일정</button>
    <button class="tab" data-tab="standings">🏆 순위</button>
    <button class="tab" data-tab="spring">🌸 봄배구·컵대회</button>
    <button class="tab" data-tab="players">🏐 선수 기록</button>
    <button class="tab" data-tab="arenas">🏟️ 경기장</button>
    <button class="tab" data-tab="teams">📣 팀 소개</button>
    <button class="tab" data-tab="news">📰 오늘 기사</button>
  </nav>

  <main class="container">
    <section id="panel-myteam" class="panel"></section>
    <section id="panel-schedule" class="panel active"></section>
    <section id="panel-standings" class="panel"></section>
    <section id="panel-spring" class="panel"></section>
    <section id="panel-players" class="panel"></section>
    <section id="panel-arenas" class="panel"></section>
    <section id="panel-teams" class="panel"></section>
    <section id="panel-news" class="panel"></section>
  </main>

  <div id="game-modal" aria-modal="true" role="dialog">
    <div class="gm-backdrop" onclick="closeGame()"></div>
    <div class="gm-panel"><button class="gm-close" onclick="closeGame()" aria-label="닫기">✕</button><div id="gm-body"></div></div>
  </div>

  <footer class="footer">
    데이터 출처: 네이버 스포츠 · 한국배구연맹(KOVO) · Google 뉴스 &nbsp;|&nbsp;
    GitHub Actions로 자동 수집되는 정적 대시보드
  </footer>

  <script>document.write('<script src="assets/app.js?v=' + window.__V + '"><\/script>');</script>
</body>
</html>
