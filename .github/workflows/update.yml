name: V리그 데이터 자동 수집

on:
  schedule:
    # UTC 기준 (한국시간 = UTC+9). GitHub 예약은 가끔 건너뛰므로 넉넉히 걸어 둔다.
    - cron: "17,47 * * * *"       # 하루 종일 30분마다
    - cron: "7-57/10 4-13 * * *"  # 한국시간 13~22시(경기 시간대)엔 10분마다
  workflow_dispatch:              # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: vleague-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 데이터 수집
        run: python collect.py
      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "chore: V리그 데이터 자동 갱신 ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            echo "푸시 충돌, 재시도 $i"; sleep 5
          done
          exit 1
