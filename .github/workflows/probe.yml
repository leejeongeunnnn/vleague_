name: 네이버 중계 주소 탐색 (임시)
on:
  push:
    paths: [".github/workflows/probe.yml", "tools/probe.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: |
          python tools/probe.py 20261019824M13 || true
          python tools/probe.py 20261019824M14 > /dev/null 2>&1 || true
      - name: probe 브랜치에 저장
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd probe && git init -q -b probe && git add . \
            && git -c user.name=bot -c user.email=bot@x commit -q -m probe \
            && git push -q -f "$PUSH_URL" probe:probe
