name: diag-net
on:
  push:
    branches: [diag-net]
jobs:
  d:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - shell: bash {0}
        run: |
          pip install -q requests
          python diag/probe.py
          cd out && git init -q -b diag-out && git add . && git -c user.name=b -c user.email=b@x commit -qm out
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-out:diag-out
